<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOMGuard</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="w-80 p-4">
      <h1 class="text-lg font-semibold text-slate-900">DOMGuard</h1>
      <p class="mt-1 text-sm text-slate-600">Mask sensitive data on the current tab.</p>
      <label class="mt-4 flex items-center justify-between gap-2 text-sm text-slate-700">
        <span>Mask style</span>
        <select id="mask-style" class="rounded border border-slate-300 px-2 py-1 text-sm">
          <option value="black">Solid black</option>
          <option value="blur">Blur</option>
        </select>
      </label>
      <div class="mt-3 flex flex-col gap-2">
        <button id="scan-and-mask" type="button" class="rounded bg-slate-900 px-3 py-2 text-sm text-white">
          Scan &amp; Mask
        </button>
        <button id="clear-masks" type="button" class="rounded border border-slate-300 px-3 py-2 text-sm">
          Clear Masks
        </button>
        <button id="toggle-picker" type="button" class="rounded border border-slate-300 px-3 py-2 text-sm">
          Manual picker: off
        </button>
        <button id="detect-hidden-text" type="button" class="rounded border border-slate-300 px-3 py-2 text-sm">
          Scan Hidden Text
        </button>
        <button id="sanitize-before-capture" type="button" class="rounded border border-slate-300 px-3 py-2 text-sm">
          Sanitize Before Capture
        </button>
        <button id="restore-after-capture" type="button" class="rounded border border-slate-300 px-3 py-2 text-sm">
          Restore After Capture
        </button>
        <button id="capture-screenshot" type="button" class="rounded border border-slate-300 px-3 py-2 text-sm">
          Capture Screenshot
        </button>
        <button id="check-pro" type="button" class="rounded border border-slate-300 px-3 py-2 text-sm">
          Check Pro
        </button>
      </div>
      <p id="status" class="mt-4 min-h-10 rounded bg-slate-100 px-3 py-2 text-xs text-slate-700">
        Ready.
      </p>
      <!-- Filled only by main.ts, with createElement and textContent. -->
      <ul id="hidden-text-findings" class="mt-2 flex flex-col gap-1 text-xs"></ul>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
